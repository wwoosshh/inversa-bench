[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inversa"
version = "0.1.0"
description = "Measure AI reasoning by problem-posing with machine-verifiable scoring"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Woosunghyeun (우성현)", email = "nunconnect1@gmail.com"}]
dependencies = [
    "sympy>=1.12",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
paper = ["pypandoc-binary>=1.13", "typst>=0.11", "matplotlib>=3.7", "adjustText>=1.0"]  # PDF build

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
